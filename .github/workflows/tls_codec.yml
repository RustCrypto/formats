name: tls_codec

on:
  pull_request:
    paths:
      - ".github/workflows/tls_codec.yml"
      - "tls_codec/**"
      - "Cargo.*"
  push:
    branches:
      - master

defaults:
  run:
    working-directory: tls_codec

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Dwarnings"

# Cancels CI jobs when new commits are pushed to a PR branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.85.0 # MSRV
          - stable
        target:
          - wasm32-unknown-unknown
          - thumbv7em-none-eabi
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}
      - uses: RustCrypto/actions/cargo-hack-install@master
      - run: cargo hack build --target ${{ matrix.target }} --feature-powerset --exclude-features std,default,serde,arbitrary

  minimal-versions:
    uses: RustCrypto/actions/.github/workflows/minimal-versions.yml@master
    with:
      working-directory: ${{ github.workflow }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # 32-bit Linux
          - targets: i686-unknown-linux-gnu
            rust: 1.85.0 # MSRV
            deps: sudo apt update && sudo apt install gcc-multilib
          - targets: i686-unknown-linux-gnu
            rust: stable
            deps: sudo apt update && sudo apt install gcc-multilib

          # 64-bit Linux
          - targets: x86_64-unknown-linux-gnu
            rust: 1.85.0 # MSRV
          - targets: x86_64-unknown-linux-gnu
            rust: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.targets }}
      - run: ${{ matrix.deps }}
      - uses: RustCrypto/actions/cargo-hack-install@master
      - run: cargo hack test --target ${{ matrix.targets }} --feature-powerset
      - run: cargo hack test --target ${{ matrix.targets }} -p tls_codec_derive --feature-powerset --test encode\* --test decode\*
      - run: cargo hack test --target ${{ matrix.targets }} -p tls_codec_derive --feature-powerset --doc
      - run: cargo test --target ${{ matrix.targets }} --benches

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - run: |
          for fuzz_target in inverse string deserialize bytes_inverse; do
            cargo fuzz run --target x86_64-unknown-linux-gnu "$fuzz_target" -- -max_total_time=5
          done
