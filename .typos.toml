[files]
extend-exclude = [
    ".git/",
    "const-oid/oiddbgen/*.txt",
    "const-oid/oiddbgen/ldap-parameters-3.csv",
    "const-oid/src/db/generated.rs",
    "der/src/asn1/context_specific.rs",
    "pem-rfc7468/README.md",
    "pkcs12/tests/cert_tests.rs",
    "x509-ocsp/tests/responses.rs",
]

[default.extend-identifiers]
# typ stands for type, but it's a reversed identifier
typ = "typ"
# tls_codec proofs: a Lean module named in NOTES.md, a regex in gen_verification.py
VecSer = "VecSer"
THM = "THM"

[default.extend-words]
consts = "consts"
# Certificate Ann
"cann" = "cann"
# encrypt-decrypt-encrypt
"EDE" = "EDE"
# the hax verification toolchain (tls_codec proofs)
hax = "hax"

# Lean proofs: hypotheses are named `h` + a short tag (`henc`, `hge`, `hpe`, ...).
[type.lean]
extend-glob = ["*.lean"]
extend-ignore-identifiers-re = ["^h[A-Za-z0-9_]*$"]

[type.lean.extend-words]
# short for "serialize" (e.g. `serB`, `PrefixSer`)
ser = "ser"
# Lean's `thmInfo`
thm = "thm"
alls = "alls"
byt = "byt"
